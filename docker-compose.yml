services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: friday
      POSTGRES_PASSWORD: friday
      POSTGRES_DB: friday
    ports:
      - "5438:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      CHECKPOINT_DB_URL: postgresql://friday:friday@db:5432/friday
    ports:
      - "8005:8005"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
