# Langfuse tracing is vendored by reference, not by copy: the upstream compose
# file is 200+ lines that would rot here, so clone it as a sibling of this repo
# (`git clone https://github.com/langfuse/langfuse ../langfuse`) and its secrets
# stay in ../langfuse/.env. docker-compose.tracing.yml puts those services
# behind the "tracing" profile so they do not start by default.
include:
  - path:
      - ../langfuse/docker-compose.yml
      - ./docker-compose.tracing.yml
    env_file: ../langfuse/.env

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: friday
      POSTGRES_PASSWORD: friday
      POSTGRES_DB: friday
    ports:
      - "5438:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Disabled: using Qdrant Cloud instead of local container
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   restart: unless-stopped
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   healthcheck:
  #     test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8005", "--reload", "--reload-dir", "/app/app"]
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      CHECKPOINT_DB_URL: postgresql://friday:friday@db:5432/friday
      # QDRANT_URL: http://qdrant:6333  # Overridden by backend/.env QDRANT_URL for cloud
    ports:
      - "8005:8005"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      # qdrant:
      #   condition: service_healthy

# Note: frontend is intentionally NOT in this compose file.
# Run it separately with: cd frontend && npm run dev
# This keeps hot-reload fast and avoids a container build round-trip on every
# source change during development.

volumes:
  db_data:
  # qdrant_data:
