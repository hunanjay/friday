# Langfuse tracing is vendored by reference, not by copy: the upstream compose
# file is 200+ lines that would rot here, so clone it as a sibling of this repo
# (`git clone https://github.com/langfuse/langfuse ../langfuse`) and its secrets
# stay in ../langfuse/.env. This file is only pulled in when explicitly passed
# with -f, so a plain `docker compose up` (docker-compose.yml alone) needs no
# ../langfuse checkout at all. The Langfuse stack is ~2.2 GB of RAM and
# ClickHouse idles at real CPU, which is not worth paying for unless you are
# actually reading traces.
#
#   docker compose -f docker-compose.yml -f docker-compose.tracing.yml --profile tracing up -d     # start tracing
#   docker compose -f docker-compose.yml -f docker-compose.tracing.yml --profile tracing stop       # stop it, keep the data
include:
  - path: ../langfuse/docker-compose.yml
    env_file: ../langfuse/.env

services:
  langfuse-web:
    profiles: ["tracing"]
  langfuse-worker:
    profiles: ["tracing"]
  clickhouse:
    profiles: ["tracing"]
  minio:
    profiles: ["tracing"]
  redis:
    profiles: ["tracing"]
  postgres:
    profiles: ["tracing"]
